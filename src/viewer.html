/* ───────────── intra-line word diff ───────────── */
function wordDiff(a, b) {

/* ───────────── rendering ───────────── */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const store = {

};
const KEY = 'dw:' + (DATA ? DATA.title : '');
const groups = DATA ? parseDiff(DATA.diff) : [];
const files = groups.flatMap((g) => g.files);
files.forEach((f, i) => { f.id = i; f.fam = famOf(f.path || ''); f.rows = f.hunks.reduce((n, h) => n + h.lines.length, 0); f.hunks.forEach(annotate); });
const totals = files.reduce((t, f) => (t.a += f.adds, t.d += f.dels, t), { a: 0, d: 0 });
let mode = new URLSearchParams(location.search).get('view') || store.get('dw:mode', 'unified');
let viewed = new Set(store.get(KEY + ':viewed', []));
const loaded = new Set();
const BIG = 1500;

const splitPath = (p) => { const i = p.lastIndexOf('/'); return [i < 0 ? '' : p.slice(0, i + 1), p.slice(i + 1)]; };
const sg = (x) => x.t === 'add' ? '+' : x.t === 'del' ? '−' : '';

function unifiedTable(f) {

    hk.lines.forEach((x) => {

      h += `<tr class="${x.t}"${id}><td class="ln" data-a="L${x.o ?? ''}" data-ln="${x.o ?? ''}">${x.o ?? ''}</td><td class="ln" data-ln="${x.n ?? ''}" data-a="R${x.n ?? ''}">${x.n ?? ''}</td><td class="c"><span class="sg">${sg(x)}</span>${paint(x.s, f.fam, x.rg)}</td></tr>`;

}
function hunkRow(hk, span, lnSpan) {

}
function splitTable(f) {

}

    <header class="fhead">
      <button class="chev" aria-label="Collapse file" data-toggle="${f.id}"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg></button>

function stripHtml() {

    }).join('')}</ul>
    <div class="prog"><span id="prog"></span><span class="keys"><kbd>j</kbd> <kbd>k</kbd> <kbd>s</kbd> <kbd>v</kbd></span></div></aside>`;
}
function render() {
  document.title = 'dw · ' + (DATA ? DATA.title : '');
  const app = $('#app');
  const cmd = DATA ? DATA.title : '';
  const top = `<div class="top"><div class="brand"><i>d</i><u>w</u></div><div class="cmd" title="${esc(cmd)}"><b>$</b> ${esc(cmd)}</div>
    <div class="tot"><span class="f">${files.length} file${files.length === 1 ? '' : 's'}</span><span class="a">+${totals.a}</span><span class="d">−${totals.d}</span></div>
    <div class="seg" role="group" aria-label="Diff layout"><button data-mode="unified" aria-pressed="${mode === 'unified'}">Unified</button><button data-mode="split" aria-pressed="${mode === 'split'}">Split</button></div>
    <button class="theme" id="theme" aria-label="Switch light/dark theme" title="Switch light/dark theme"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></svg></button></div>`;

function updateProgress() {

}
function rerenderFile(id) {

}

/* ───────────── interaction ───────────── */
let cur = 0;

function go(i) {

}
document.addEventListener('click', (e) => {
  const t = e.target;
  if (t.closest('#theme')) {
    const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'light' : 'dark'; store.set('dw:theme', dark ? 'light' : 'dark'); return;
  }

  if (m) { mode = m.dataset.mode; store.set('dw:mode', mode); $$('[data-mode]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.mode === mode)); files.forEach((f) => { $('#file-' + f.id + ' .fbody').innerHTML = (f.notes.length ? `<div class="modes">${esc(f.notes.join('  ·  '))}</div>` : '') + bodyHtml(f); }); return; }
  const tg = t.closest('[data-toggle]');

  const ld = t.closest('[data-load]');
  if (ld) { loaded.add(+ld.dataset.load); rerenderFile(+ld.dataset.load); return; }
  const ln = t.closest('td.ln[data-a]');
  if (ln && ln.dataset.ln) { const fid = ln.closest('.file').dataset.id; const id = `f${fid}-${ln.dataset.a}`; if (document.getElementById(id)) { history.replaceState(null, '', '#' + id); document.getElementById(id).scrollIntoView({ block: 'center' }); window.dispatchEvent(new HashChangeEvent('hashchange')); } return; }

document.addEventListener('change', (e) => { const v = e.target.closest('[data-viewed]'); if (v) setViewed(+v.dataset.viewed, v.checked); });
document.addEventListener('mousedown', (e) => {
  const td = e.target.closest('table.s td'); if (!td) return;
  const tbl = td.closest('table'); const idx = td.cellIndex;

});
document.addEventListener('input', (e) => {
  if (e.target.id !== 'filter') return;
  const q = e.target.value.toLowerCase();
  $$('#files li').forEach((li) => { li.hidden = q && !files[+li.dataset.id].path.toLowerCase().includes(q); });

  if (e.metaKey || e.ctrlKey || e.altKey) return;

  if (e.target.matches('input,textarea')) return;
  if (e.key === 'j') go(cur + 1); else if (e.key === 'k') go(cur - 1 + ($('#file-' + cur).getBoundingClientRect().top < -40 ? 1 : 0));
  else if (e.key === 's') $(`[data-mode="${mode === 'split' ? 'unified' : 'split'}"]`).click();
  else if (e.key === 'v') setViewed(cur, !viewed.has(cur));

let ticking = false;
window.addEventListener('scroll', () => { if (ticking || !files.length) return; ticking = true; requestAnimationFrame(() => { ticking = false; syncCurrent(); }); }, { passive: true });

render();

</script>
